name: Feature WebSession HTTP adapter

on:
  workflow_dispatch:
  push:
    branches:
      - refactor/room-provider-session
    paths:
      - .github/workflows/feature-web-session-http.yml
      - tool/feature_web_session_http_patch.py

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/room-provider-session
          fetch-depth: 0
      - name: Patch provider WebSession HTTP adapter
        run: python3 tool/feature_web_session_http_patch.py
      - name: Format and compile HTTP API
        run: |
          cargo fmt --all
          cargo check -p synctv-api-http --all-features
      - name: Commit implementation and remove helper files
        run: |
          git rm .github/workflows/feature-web-session-http.yml tool/feature_web_session_http_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add synctv-api-http/src/providers/common.rs
          git commit -m "Expose provider web sessions over HTTP"
          git push origin HEAD:refactor/room-provider-session
