name: Feature rustfmt fix

on:
  push:
    branches:
      - refactor/room-provider-session
    paths:
      - .github/workflows/feature-rustfmt-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/room-provider-session
          fetch-depth: 0
      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-25
          components: rustfmt
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Apply rustfmt after provider session changes"
          git push origin HEAD:refactor/room-provider-session
