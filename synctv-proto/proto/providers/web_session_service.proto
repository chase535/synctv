syntax = "proto3";

package synctv.providers.web_session;

import "google/protobuf/timestamp.proto";

// Server-owned authenticated browser sessions for providers such as iQiyi and
// Tencent Video. Cookie values are accepted only by BindWebSession and are
// never returned by this service.
service WebSessionService {
  rpc BindWebSession(BindWebSessionRequest) returns (BindWebSessionResponse);
  rpc ListWebSessions(ListWebSessionsRequest) returns (ListWebSessionsResponse);
  rpc UnbindWebSession(UnbindWebSessionRequest) returns (UnbindWebSessionResponse);
}

enum WebSessionProvider {
  WEB_SESSION_PROVIDER_UNSPECIFIED = 0;
  WEB_SESSION_PROVIDER_IQIYI = 1;
  WEB_SESSION_PROVIDER_TENCENT_VIDEO = 2;
}

message WebSessionCookie {
  string name = 1;
  string value = 2;
  string domain = 3;
  string path = 4;
  bool secure = 5;
  bool http_only = 6;
  bool session_only = 7;
  optional int64 expires_at = 8;
}

message BindWebSessionRequest {
  WebSessionProvider provider = 1;
  string label = 2;
  repeated WebSessionCookie cookies = 3;
}

message BindWebSessionResponse {
  WebSessionBinding binding = 1;
}

message ListWebSessionsRequest {}

message ListWebSessionsResponse {
  repeated WebSessionBinding bindings = 1;
}

message UnbindWebSessionRequest {
  WebSessionProvider provider = 1;
}

message UnbindWebSessionResponse {
  bool removed = 1;
}

message WebSessionBinding {
  int64 credential_id = 1;
  WebSessionProvider provider = 2;
  string server_id = 3;
  string label = 4;
  uint32 cookie_count = 5;
  optional google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}
